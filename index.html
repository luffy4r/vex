    <style>
        body { background-color: #ffffff; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-enter { animation: fadeIn 0.3s ease-out forwards; }
        .modal-content-enter { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 100%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        
        input[type="radio"].eva-radio {
            accent-color: #164081;
            width: 1.25rem; height: 1.25rem;
            cursor: pointer;
        }
        
        .loader {
            border: 3px solid #f0f4f8; border-top: 3px solid #164081;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .variant-btn.active {
            border-color: #164081;
            transform: scale(1.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); }
    }
    .success-icon-anim { 
        animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }
    .fade-in-section { 
        animation: fadeIn 0.4s ease-out forwards; 
    } 
        /* Animation du cercle qui se dessine */
    .anim-check-circle {
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: drawCheck 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    /* Remplissage doux en arrière-plan */
    .anim-check-fill {
        animation: fillCheck 0.4s ease-out 0.5s forwards;
    }
    /* Animation de la coche qui se dessine */
    .anim-check-path {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: drawCheck 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards;
    }
    /* Halo lumineux autour (Glow) */
    .anim-check-glow {
        animation: glowCheck 1.5s ease-out 0.7s infinite alternate forwards;
    }

    @keyframes drawCheck {
        to { stroke-dashoffset: 0; }
    }
    @keyframes fillCheck {
        to { fill: #f0fdf4; }
    }
    @keyframes glowCheck {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 0.4; transform: scale(1.2); }
    } 
        /* Animation fermeture pop-up (Slide Down) */
    .modal-content-exit {
        animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideDown {
        from { opacity: 1; transform: translate(-50%, -50%); }
        to { opacity: 0; transform: translate(-50%, 100%); }
    }

    /* Animation suppression article (Glissement poubelle) */
    .item-delete-anim {
        animation: slideOutTrash 0.3s ease-in forwards;
    }
    @keyframes slideOutTrash {
        50% { opacity: 0.5; transform: scale(0.95) translateX(10px); }
        100% { opacity: 0; transform: scale(0.9) translateX(50px); }
    } 

        .btn-tactile {
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-tactile:active {
        transform: scale(0.80);
    } 
        /* Animation des avantages */
    .stagger-item {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stagger-item.is-visible {
        opacity: 1;
        transform: translateY(0);
    }
    .stagger-delay-1 { transition-delay: 0.1s; }
    .stagger-delay-2 { transition-delay: 0.25s; }
    .stagger-delay-3 { transition-delay: 0.4s; }
